<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pentatonic Fretboard Challenge 2.1</title>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;

            background:
                radial-gradient(circle at top, #30343b 0%, #17191d 55%, #0d0e10 100%);

            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .app {
            width: min(1100px, 100%);
            margin: 0 auto;
            padding: 24px;

            background: rgba(25, 27, 31, 0.96);
            border: 1px solid #3b3f46;
            border-radius: 18px;

            box-shadow:
                0 18px 50px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        h1 {
            margin: 0 0 20px;
            text-align: center;
            font-size: clamp(24px, 4vw, 36px);
            letter-spacing: 0.5px;
        }
        .scale-selector{
            display:flex;
            justify-content:center;
            gap:10px;
            margin-bottom:15px;
        }

        .scale-selector button{
            min-height: 44px;
            padding:10px 18px;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
        }
        .scale-selector button.active-scale {
            background: #daf2d0;
            outline: 3px solid #ffd84d;
            font-weight: bold;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, minmax(145px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            padding: 12px 14px;

            background: #22252a;
            border: 1px solid #3e434b;
            border-radius: 12px;

            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .stat-icon {
            flex: 0 0 auto;
            font-size: 26px;
            filter: grayscale(0.15);
        }

        .stat-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .stat-label {
            color: #aeb4bc;
            font-size: 13px;
            white-space: nowrap;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            white-space: nowrap;
        }

        .stat-value small {
            margin-left: 2px;
            color: #9298a0;
            font-size: 14px;
        }

        .fretboard {
            display: grid;
            grid-template-columns: repeat(16, minmax(0, 1fr));
            grid-template-rows: repeat(6, clamp(30px, 4.5vw, 48px));

            width: 100%;
            margin-bottom: 24px;
            overflow: hidden;

            /* Donker palissanderhout met subtiele nerven */
            background:
                repeating-linear-gradient(
                    91deg,
                    transparent 0,
                    rgba(255,255,255,0.025) 2px,
                    transparent 4px,
                    transparent 18px,
                    rgba(0,0,0,0.12) 20px,
                    transparent 23px
                ),
                repeating-linear-gradient(
                    87deg,
                    transparent 0,
                    transparent 38px,
                    rgba(0,0,0,0.18) 40px,
                    transparent 43px,
                    transparent 75px
                ),
                linear-gradient(
                    90deg,
                    #26140d 0%,
                    #44271a 12%,
                    #30180f 25%,
                    #513020 39%,
                    #2c160e 53%,
                    #48291b 68%,
                    #28140d 82%,
                    #432519 100%
                );

            border: 4px solid #111;
            border-radius: 10px;

            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.55),
                inset 0 3px 5px rgba(255, 255, 255, 0.08),
                inset 0 -5px 10px rgba(0, 0, 0, 0.55);
        }

        .fret {
            position: relative;
            min-width: 0;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;
            overflow: visible;

            /* Metalen fret */
            border-right: 3px solid #9da2a5;
            border-bottom: none;

            box-shadow:
                inset -1px 0 0 rgba(255, 255, 255, 0.95),
                inset -3px 0 1px rgba(0, 0, 0, 0.65);

            font-size: 20px;
            font-weight: bold;
            color: #111;
        }
        .fret::before {
            content: "";
            position: absolute;

            left: -3px;
            right: -3px;
            top: 50%;

            height: 2px;

            background:
                linear-gradient(
                    to bottom,
                    #5c5c5c 0%,
                    #f5f5f5 28%,
                    #a5a5a5 55%,
                    #4c4c4c 100%
                );

            box-shadow:
                0 1px 1px rgba(0, 0, 0, 0.85),
                0 -1px 1px rgba(255, 255, 255, 0.18);

            transform: translateY(-50%);
            z-index: 4;
            pointer-events: none;
        }  

        .fret:last-child {
            border-right-color: #9da2a5;
        }

        .fret.pink {
            background:
                linear-gradient(
                    135deg,
                    rgba(170, 52, 28, 0.55),
                    rgba(85, 20, 10, 0.48)
                );

            box-shadow:
                inset 0 1px 0 rgba(255, 190, 170, 0.12),
                inset 0 -2px 5px rgba(0, 0, 0, 0.25),
                inset -1px 0 0 rgba(255, 255, 255, 0.95),
                inset -3px 0 1px rgba(0, 0, 0, 0.65);
        }

        .fret.green {
            background:
                linear-gradient(
                    135deg,
                    rgba(58, 145, 34, 0.55),
                    rgba(18, 72, 10, 0.48)
                );

            box-shadow:
                inset 0 1px 0 rgba(190, 255, 175, 0.12),
                inset 0 -2px 5px rgba(0, 0, 0, 0.25),
                inset -1px 0 0 rgba(255, 255, 255, 0.95),
                inset -3px 0 1px rgba(0, 0, 0, 0.65);
        }


        .string5::before{
            height:5px;
        }

        .string4::before{
            height:4px;
        }

        .string3::before{
            height:3px;
        }

        .string2::before{
            height:2.5px;
        }

        .string1::before{
            height:2px;
        }

        .string0::before{
            height:1.5px;
        }
        .answers {
            display: grid;
            grid-template-columns: repeat(9, minmax(0, 1fr));
            gap: 8px;
        }
        .fret.target {
            outline: 4px solid #ffd84d;
            outline-offset: -4px;
            z-index: 2;
        }

        .fret.target::after {
            content: "?";
            display: flex;
            align-items: center;
            justify-content: center;

            width: 32px;
            height: 32px;

            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    #ffffff 0%,
                    #ffe676 25%,
                    #ffc400 62%,
                    #a96c00 100%
                );

            color: black;
            font-size: 22px;
            font-weight: bold;

            position: relative;
            z-index: 6;

            box-shadow:
                0 3px 7px rgba(0,0,0,0.65),
                inset 0 1px 1px rgba(255,255,255,0.8);
        }
        .answers button {
            min-height: 58px;

            background:
                linear-gradient(180deg, #41464e, #2d3137);

            color: white;

            border: 1px solid #5c626c;
            border-radius: 12px;

            font-size: 22px;
            font-weight: bold;
            cursor: pointer;

            box-shadow:
                0 5px 10px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.09);

            transition:
                transform 0.1s ease,
                filter 0.1s ease,
                box-shadow 0.1s ease;
        }

        .answers button:hover {
            filter: brightness(1.15);
            transform: translateY(-2px);
        }

        .answers button:active {
            transform: translateY(1px);
            box-shadow:
                0 2px 5px rgba(0, 0, 0, 0.3),
                inset 0 2px 5px rgba(0, 0, 0, 0.25);
        }

        .correct {
            background: #238636;
        }

        .wrong {
            background: #b62324;
        }

        [hidden] {
            display: none !important;
        }

        .result-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(5, 6, 8, 0.78);
            backdrop-filter: blur(6px);
        }

        .result-panel {
            width: min(460px, 100%);
            padding: 26px;
            text-align: center;
            background: linear-gradient(180deg, #292d33, #1b1e22);
            border: 1px solid #4c525b;
            border-radius: 18px;
            box-shadow: 0 24px 65px rgba(0, 0, 0, 0.65);
        }

        .result-trophy {
            font-size: 48px;
            margin-bottom: 4px;
        }

        .result-panel h2 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .record-message {
            min-height: 24px;
            margin: 0 0 18px;
            color: #ffd84d;
            font-weight: bold;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }

        .result-item {
            padding: 13px 8px;
            background: #202328;
            border: 1px solid #3d424a;
            border-radius: 11px;
        }

        .result-item span {
            display: block;
            margin-bottom: 5px;
            color: #aeb4bc;
            font-size: 13px;
        }

        .result-item strong {
            font-size: 20px;
        }

        .result-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .result-actions button {
            min-height: 48px;
            padding: 10px 14px;
            border: 1px solid #d6ae22;
            border-radius: 11px;
            background: linear-gradient(180deg, #ffe273, #d4a400);
            color: #171717;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .result-actions .secondary-button {
            border-color: #59606a;
            background: linear-gradient(180deg, #41464e, #2d3137);
            color: #fff;
        }

        @media (max-width: 600px) {
            body {
                /*padding: 8px;*/
                padding-bottom:70px;
            }

            .app {
                padding: 14px;
                border-radius: 12px;
            }

            .dashboard {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .scale-selector {
                flex-wrap: wrap;
            }

            .scale-selector button {
                flex: 1 1 145px;
            }

            .stat-card {
                padding:8px 10px;
                gap: 6px;
            }

            .stat-icon {
                font-size: 22px;
            }

            .stat-value {
                font-size: 20px;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }

            .fretboard {
                grid-template-columns: repeat(16, minmax(0, 1fr));
                grid-template-rows: repeat(6, clamp(30px, 9vw, 38px));
                border-width: 3px;
            }

            .fret {
                border-right-width: 2px;
                height:28px;
                font-size:16px;
            }

            .fret::before {
                left: -2px;
                right: -2px;
            }

            .fret.target {
                outline-width: 3px;
                outline-offset: -3px;
            }

            .fret.target::after {
                width: clamp(22px, 7vw, 29px);
                height: clamp(22px, 7vw, 29px);
                font-size: clamp(16px, 5vw, 20px);
            }

            .answers {
                gap: 5px;
            }

            .answers button {
                min-width: 0;
                min-height: 50px;
                padding: 6px 2px;
                font-size: clamp(16px, 5vw, 21px);
            }
        }

        @media (max-width: 400px) {
            .scale-selector button {
                flex: 1 1 100%;
            }

            .answers button {
                min-height:40px;
                font-size:18px;
                border-radius:8px;
                position:fixed;
                left:0;
                right:0;
                bottom:0;

                padding:8px;

                background:#1b1d20;

                border-top:1px solid #555;

                z-index:100;
            }
        }
    </style>
</head>

<body>

<div class="app">
    <h1 id="title">Blues Scale Challenge</h1>

    <div class="scale-selector">
        <button data-scale="minor">Minor Pentatonic</button>
        <button data-scale="major">Major Pentatonic</button>
        <button data-scale="blues">Blues Scale</button>
    </div>
    <div class="dashboard" aria-label="Spelstatistieken">
        <div class="stat-card">
            <span class="stat-icon" aria-hidden="true">🎯</span>
            <span class="stat-text">
                <span class="stat-label">Score</span>
                <span class="stat-value"><strong id="score">0</strong></span>
            </span>
        </div>

        <div class="stat-card">
            <span class="stat-icon" aria-hidden="true">🏆</span>
            <span class="stat-text">
                <span class="stat-label">High score</span>
                <span class="stat-value"><strong id="highScore">0</strong></span>
            </span>
        </div>

        <div class="stat-card">
            <span class="stat-icon" aria-hidden="true">🔢</span>
            <span class="stat-text">
                <span class="stat-label">Vraag</span>
                <span class="stat-value">
                    <strong id="question">0</strong><small>/30</small>
                </span>
            </span>
        </div>

        <div class="stat-card">
            <span class="stat-icon" aria-hidden="true">⏱️</span>
            <span class="stat-text">
                <span class="stat-label">Tijd</span>
                <span class="stat-value"><strong id="timer">00:00</strong></span>
            </span>
        </div>
    </div>

    <div id="fretboard" class="fretboard"></div>

    <div class="answers">
        <button data-answer="1">1</button>
        <button data-answer="2">2</button>
        <button data-answer="b3">b3</button>
        <button data-answer="3">3</button>
        <button data-answer="4">4</button>
        <button data-answer="b5">b5</button>
        <button data-answer="5">5</button>
        <button data-answer="6">6</button>
        <button data-answer="7">7</button>
        
    </div>

    <div id="resultModal" class="result-modal" hidden>
        <div class="result-panel" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
            <div class="result-trophy" aria-hidden="true">🏆</div>
            <h2 id="resultTitle">Ronde voltooid</h2>
            <p id="recordMessage" class="record-message"></p>

            <div class="result-grid">
                <div class="result-item">
                    <span>Score</span>
                    <strong id="resultScore">0 / 30</strong>
                </div>
                <div class="result-item">
                    <span>Tijd</span>
                    <strong id="resultTime">00:00</strong>
                </div>
                <div class="result-item">
                    <span>High score</span>
                    <strong id="resultHighScore">0 / 30</strong>
                </div>
            </div>

            <div class="result-actions">
                <button id="playAgainButton" type="button">Nog een ronde</button>
                <button id="closeResultButton" type="button" class="secondary-button">Sluiten</button>
            </div>
        </div>
    </div>
</div>

    <script>
        const minorPattern = [
            ["p1", "", "p7", "", "", "g5", "", "g4", "", "gb3", "", "", "p1", "", "p7", ""],
            ["p5", "", "p4", "", "pb3", "", "", "g1", "", "g7", "", "", "p5", "", "p4", ""],
            ["gb3", "", "", "p1", "", "p7", "", "", "g5", "", "g4", "", "gb3", "", "", "p1"],
            ["g7", "", "", "p5", "", "p4", "", "pb3", "", "", "g1", "", "g7", "", "", "p5"],
            ["g4", "", "gb3", "", "", "p1", "", "p7", "", "", "g5", "", "g4", "", "gb3", ""],
            ["g1", "", "g7", "", "", "p5", "", "p4", "", "pb3", "", "", "g1", "", "g7", ""]
        ]
        const majorPattern = [
            ["p6", "", "p5", "", "", "g3", "", "g2", "", "g1", "", "", "p6", "", "p5", ""],
            ["p3", "", "p2", "", "p1", "", "", "g6", "", "g5", "", "", "p3", "", "p2", ""],
            ["g1", "", "", "p6", "", "p5", "", "", "g3", "", "g2", "", "g1", "", "", "p6"],
            ["g1", "", "", "p3", "", "p2", "", "p1", "", "", "g6", "", "g5", "", "", "p3"],
            ["g2", "", "g1", "", "", "p6", "", "p5", "", "", "g3", "", "g2", "", "g1", ""],
            ["g6", "", "g5", "", "", "p3", "", "p2", "", "p1", "", "", "g6", "", "g5", ""]
        ]
        const bluesPattern = [
            ["p1", "", "p7", "", "", "g5", "gb5", "g4", "", "gb3", "", "", "p1", "", "p7", ""],
            ["p5", "pb5", "p4", "", "pb3", "", "", "g1", "", "g7", "", "", "p5", "pb5", "p4", ""],
            ["gb3", "", "", "p1", "", "p7", "", "", "g5", "gb5", "g4", "", "gb3", "", "", "p1"],
            ["g7", "", "", "p5", "pb5", "p4", "", "pb3", "", "", "g1", "", "g7", "", "", "p5"],
            ["g4", "", "gb3", "", "", "p1", "", "p7", "", "", "g5", "gb5", "g4", "", "gb3", ""],
            ["g1", "", "g7", "", "", "p5", "pb5", "p4", "", "pb3", "", "", "g1", "", "g7", ""]
        ];
        const scales = {
            minor: {
                title: "Minor Pentatonic Challenge",
                pattern: minorPattern
            },

            major: {
                title: "Major Pentatonic Challenge",
                pattern: majorPattern
            },

            blues: {
                title: "Blues Scale Challenge",
                pattern: bluesPattern
            }
        };
        const TOTAL_QUESTIONS = 30;
        const STORAGE_PREFIX = "fretboardChallengeHighScore_";

        let currentScale = "blues";
        let fretboardPattern = scales[currentScale].pattern;
        let positions = [];
        let score = 0;
        let questionNumber = 0;
        let currentPosition = null;
        let acceptingAnswer = false;
        let gameActive = false;
        let startTime = 0;
        let elapsedMilliseconds = 0;
        let timerInterval = null;

        const fretboard = document.getElementById("fretboard");
        const scoreDisplay = document.getElementById("score");
        const highScoreDisplay = document.getElementById("highScore");
        const questionDisplay = document.getElementById("question");
        const timerDisplay = document.getElementById("timer");
        const resultModal = document.getElementById("resultModal");
        const resultScore = document.getElementById("resultScore");
        const resultTime = document.getElementById("resultTime");
        const resultHighScore = document.getElementById("resultHighScore");
        const recordMessage = document.getElementById("recordMessage");

        function getPlayablePositions() {
            const playablePositions = [];

            fretboardPattern.forEach((row, stringIndex) => {
                row.forEach((cellCode, fretIndex) => {
                    if (cellCode !== "") {
                        playablePositions.push({
                            string: stringIndex,
                            fret: fretIndex,
                            color: cellCode.charAt(0),
                            answer: cellCode.substring(1)
                        });
                    }
                });
            });

            return playablePositions;
        }

        function getHighScore(scaleName) {
            try {
                const savedValue = localStorage.getItem(STORAGE_PREFIX + scaleName);
                const parsedValue = Number.parseInt(savedValue ?? "0", 10);
                return Number.isFinite(parsedValue) ? parsedValue : 0;
            } catch (error) {
                console.warn("High score kon niet worden gelezen:", error);
                return 0;
            }
        }

        function saveHighScore(scaleName, value) {
            try {
                localStorage.setItem(STORAGE_PREFIX + scaleName, String(value));
            } catch (error) {
                console.warn("High score kon niet worden opgeslagen:", error);
            }
        }

        function formatTime(milliseconds) {
            const totalSeconds = Math.floor(milliseconds / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
        }

        function updateTimer() {
            if (gameActive) {
                elapsedMilliseconds = Date.now() - startTime;
            }
            timerDisplay.textContent = formatTime(elapsedMilliseconds);
        }

        function startTimer() {
            stopTimer();
            elapsedMilliseconds = 0;
            startTime = Date.now();
            gameActive = true;
            updateTimer();
            timerInterval = window.setInterval(updateTimer, 250);
        }

        function stopTimer() {
            if (timerInterval !== null) {
                window.clearInterval(timerInterval);
                timerInterval = null;
            }
            if (gameActive && startTime) {
                elapsedMilliseconds = Date.now() - startTime;
            }
            gameActive = false;
            updateTimer();
        }

        function selectScale(scaleName) {
            if (!scales[scaleName]) {
                console.error("Onbekende toonladder:", scaleName);
                return;
            }

            resultModal.hidden = true;
            currentScale = scaleName;
            fretboardPattern = scales[scaleName].pattern;
            score = 0;
            questionNumber = 0;
            currentPosition = null;
            acceptingAnswer = false;

            scoreDisplay.textContent = "0";
            questionDisplay.textContent = "0";
            highScoreDisplay.textContent = getHighScore(scaleName);
            timerDisplay.textContent = "00:00";

            document.getElementById("title").textContent = scales[scaleName].title;
            document.body.classList.remove("correct", "wrong");

            createFretboard();
            positions = getPlayablePositions();

            if (positions.length === 0) {
                console.error("Het gekozen patroon bevat geen speelbare posities.");
                return;
            }

            updateScaleButtons(scaleName);
            startTimer();
            nextQuestion();
        }

        function createFretboard() {
            fretboard.innerHTML = "";

            fretboardPattern.forEach((row, stringIndex) => {
                row.forEach((cellCode, fretIndex) => {
                    const cell = document.createElement("div");
                    cell.classList.add("fret", "string" + stringIndex);

                    if (cellCode !== "") {
                        const colorCode = cellCode.charAt(0);
                        if (colorCode === "p") cell.classList.add("pink");
                        if (colorCode === "g") cell.classList.add("green");
                    }

                    cell.dataset.string = stringIndex;
                    cell.dataset.fret = fretIndex;
                    fretboard.appendChild(cell);
                });
            });
        }

        function clearTarget() {
            document.querySelectorAll(".target").forEach(cell => {
                cell.classList.remove("target");
            });
        }

        function updateScaleButtons(activeScale) {
            document.querySelectorAll("[data-scale]").forEach(button => {
                button.classList.toggle(
                    "active-scale",
                    button.dataset.scale === activeScale
                );
            });
        }

        function nextQuestion() {
            if (questionNumber >= TOTAL_QUESTIONS) {
                finishGame();
                return;
            }

            clearTarget();
            const randomIndex = Math.floor(Math.random() * positions.length);
            currentPosition = positions[randomIndex];

            const selector =
                `[data-string="${currentPosition.string}"]` +
                `[data-fret="${currentPosition.fret}"]`;

            const targetCell = document.querySelector(selector);
            if (!targetCell) {
                console.error("Doelvak kon niet worden gevonden.");
                return;
            }

            targetCell.classList.add("target");
            questionNumber++;
            questionDisplay.textContent = questionNumber;
            acceptingAnswer = true;
        }

        function checkAnswer(answer) {
            if (!currentPosition || !acceptingAnswer || !gameActive) return;
            acceptingAnswer = false;

            const isCorrect =
                answer.toLowerCase() === currentPosition.answer.toLowerCase();

            if (isCorrect) {
                score++;
                scoreDisplay.textContent = score;
                document.body.classList.add("correct");
            } else {
                document.body.classList.add("wrong");
            }

            window.setTimeout(() => {
                document.body.classList.remove("correct", "wrong");
                nextQuestion();
            }, 250);
        }

        function finishGame() {
            acceptingAnswer = false;
            currentPosition = null;
            clearTarget();
            stopTimer();

            const previousHighScore = getHighScore(currentScale);
            const isNewHighScore = score > previousHighScore;
            const finalHighScore = Math.max(score, previousHighScore);

            if (isNewHighScore) {
                saveHighScore(currentScale, finalHighScore);
            }

            highScoreDisplay.textContent = finalHighScore;
            resultScore.textContent = `${score} / ${TOTAL_QUESTIONS}`;
            resultTime.textContent = formatTime(elapsedMilliseconds);
            resultHighScore.textContent = `${finalHighScore} / ${TOTAL_QUESTIONS}`;
            recordMessage.textContent = isNewHighScore
                ? "Nieuwe high score!"
                : score === TOTAL_QUESTIONS
                    ? "Perfecte score!"
                    : "Goed gespeeld!";

            resultModal.hidden = false;
        }

        document.querySelectorAll("button[data-answer]").forEach(button => {
            button.addEventListener("click", () => {
                checkAnswer(button.dataset.answer);
            });
        });

        document.querySelectorAll("[data-scale]").forEach(button => {
            button.addEventListener("click", () => {
                selectScale(button.dataset.scale);
            });
        });

        document.getElementById("playAgainButton").addEventListener("click", () => {
            selectScale(currentScale);
        });

        document.getElementById("closeResultButton").addEventListener("click", () => {
            resultModal.hidden = true;
        });

        resultModal.addEventListener("click", event => {
            if (event.target === resultModal) {
                resultModal.hidden = true;
            }
        });

        selectScale("blues");
    </script>

</body>
</html>
